# Local development backing services.
# The apps themselves run on the host via bun (see README).
#
# Engine-agnostic: works under `podman compose` and `docker compose` alike, so
# keep it free of docker-only extensions.
services:
  postgres:
    # pgvector, not stock postgres — the schema migration creates the `vector`
    # extension and an hnsw index over chunk embeddings.
    image: docker.io/pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    # The default 64MB /dev/shm is too small to build the hnsw index over a
    # populated chunks table: a restore fails with "could not resize shared
    # memory segment". Migrations create that index on an empty table, so the
    # problem only appears when restoring a real corpus, which is exactly when
    # it hurts most.
    shm_size: 1gb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
