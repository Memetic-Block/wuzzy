# Full stack: backing services (from compose.yml) plus the apps in containers.
#   podman compose -f compose.full.yml up --build   (or: docker compose ...)
include:
  - compose.yml

services:
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    environment:
      NODE_ENV: production
      # The wuzzy schema is migration-only (raw SQL: extension, hnsw index),
      # so synchronize stays off everywhere and the app migrates on boot.
      DB_MIGRATIONS_RUN: "true"
      PORT: "3000"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
    environment:
      # nginx proxies /api/ here so the browser's relative requests reach the backend.
      BACKEND_ORIGIN: http://backend:3000
    ports:
      - "8080:80"
    depends_on:
      - backend
