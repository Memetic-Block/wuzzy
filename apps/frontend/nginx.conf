worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  server {
    listen 80;
    listen [::]:80;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to the backend service (see compose.full.yml).
    # BACKEND_ORIGIN / NGINX_LOCAL_RESOLVERS are filled in at container start
    # via envsubst. Resolving through a variable defers DNS to request time, so
    # nginx still starts if the backend is down and picks up its IP if it moves.
    location /api/ {
      resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;
      set $backend_origin ${BACKEND_ORIGIN};
      proxy_pass $backend_origin;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(js|css|svg|png|jpg|jpeg|webp|woff2?)$ {
      add_header Cache-Control "public, max-age=86400";
      try_files $uri =404;
    }

    location / {
      add_header Cache-Control "no-cache";
      try_files $uri $uri.html $uri/ =404;
    }
  }
}
