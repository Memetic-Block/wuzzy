worker_processes auto;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;

  server {
    listen 80;
    listen [::]:80;
    root /usr/share/nginx/html;
    index index.html;

    # An operator tool, never a page anyone should find.
    add_header X-Robots-Tag "noindex, nofollow" always;

    # Only the admin API is proxied. The public endpoints are not reachable from
    # here, and the public site cannot reach these: the two apps are separate
    # origins on purpose, so this one can be kept off the public internet.
    location /api/admin/ {
      resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;
      set $backend_origin ${BACKEND_ORIGIN};
      rewrite ^/api/(.*)$ /$1 break;
      proxy_pass $backend_origin;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }

    location ~* \.(js|css|svg|png|jpg|jpeg|webp|woff2?)$ {
      add_header Cache-Control "no-store";
      try_files $uri =404;
    }

    location / {
      add_header Cache-Control "no-store";
      try_files $uri $uri.html $uri/ =404;
    }
  }
}
