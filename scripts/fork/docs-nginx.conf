# Serves the built docs the way the production host does.
#
# Cloudflare Pages resolves /guide/indexes to guide/indexes.html. nginx's
# default try_files does not, so without the $uri.html arm every route below
# the top level 404s and the client under test concludes those pages do not
# exist.
server {
  listen 80;
  listen [::]:80;
  root /usr/share/nginx/html;
  index index.html;

  # The directory redirect from `/guide` to `/guide/` is absolute by default,
  # and nginx builds it from the port it listens on rather than the one the
  # container is published on. That sends a reader from localhost:4000 to
  # localhost:80, which nothing serves. Relative redirects keep the origin the
  # reader arrived on.
  absolute_redirect off;

  location / {
    try_files $uri $uri.html $uri/ /404.html;
  }
}
